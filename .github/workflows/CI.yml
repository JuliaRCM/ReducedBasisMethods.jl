name: CI
on:
    - push
    - pull_request
jobs:
    test:
        name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
        runs-on: ${{ matrix.os }}
        continue-on-error: ${{ matrix.experimental }}
        strategy:
            fail-fast: false
            matrix:
                version:
                    - "1.6"
                    - "1.10"
                    - "1.12"
                    - "^1.13.0-0"
                os:
                    - ubuntu-latest
                    - macOS-latest
                    - windows-latest
                arch:
                    - default
                experimental: [false]
                include:
                    - version: "nightly"
                      os: ubuntu-latest
                      arch: default
                      experimental: true
                    - version: "nightly"
                      os: macOS-latest
                      arch: default
                      experimental: true
                    - version: "nightly"
                      os: windows-latest
                      arch: default
                      experimental: true
        steps:
            - uses: actions/checkout@v4
            - uses: julia-actions/setup-julia@v1
              with:
                  version: ${{ matrix.version }}
                  arch: ${{ matrix.arch }}
            - uses: julia-actions/cache@v1
            - uses: julia-actions/julia-buildpkg@v1
            - uses: julia-actions/julia-runtest@v1
            - uses: julia-actions/julia-processcoverage@v1
            - uses: codecov/codecov-action@v3
              env:
                  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
              with:
                  files: lcov.info
